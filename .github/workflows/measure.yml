name: measure-23163
on:
  push:
    branches: [agent-23163-measure]
permissions:
  contents: read
env:
  CODEQL_REF: aafa7deeff16c1e3c4e356eabec46cbca2dc09e3
  CLI_VERSION: v2.27.5
  TARGET_SHA: 77c60cce8d798f5b885f81ffab42ae8794123aa9
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: agent }
      - uses: actions/checkout@v4
        with: { repository: github/codeql, ref: "${{ env.CODEQL_REF }}", path: ql }
      - name: CLI
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "$CLI_VERSION" -R github/codeql-cli-binaries -p codeql-linux64.zip
          unzip -q codeql-linux64.zip && rm codeql-linux64.zip
      - name: Apply patch
        run: |
          cd ql && git apply ../agent/agent/private.patch && git diff --stat
          ../codeql/codeql query format --in-place javascript/ql/lib/semmle/javascript/PackageExports.qll
          git diff
      - name: Tests
        run: |
          cd ql/javascript/ql/test
          ../../../../codeql/codeql test run --threads=0 \
            library-tests/PackageExports \
            query-tests/Security/CWE-078/SecondOrderCommandInjection \
            query-tests/Security/CWE-078/UnsafeShellCommandConstruction \
            query-tests/Security/CWE-079/UnsafeHtmlConstruction \
            query-tests/Security/CWE-094/CodeInjection \
            query-tests/Security/CWE-400/ReDoS \
            query-tests/Security/CWE-915/PrototypePollutingAssignment 2>&1 | tee ../../../../tests.log | grep -vE '^\| ' | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tests, path: tests.log }

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { path: agent }
      - uses: actions/checkout@v4
        with: { repository: github/codeql, ref: "${{ env.CODEQL_REF }}", path: base }
      - uses: actions/checkout@v4
        with: { repository: Pasta-Devs/Marinara-Engine, ref: "${{ env.TARGET_SHA }}", path: src }
      - name: Machine
        run: nproc; free -m; df -h .
      - name: CLI
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "$CLI_VERSION" -R github/codeql-cli-binaries -p codeql-linux64.zip
          unzip -q codeql-linux64.zip && rm codeql-linux64.zip
      - name: Library variants
        run: |
          true
          cp -r base patched
          cd patched && git apply ../agent/agent/private.patch && git diff --stat && cd ..
          for v in base patched; do mkdir -p $v/javascript/ql/src/agent && cp agent/agent/Sources.ql $v/javascript/ql/src/agent/; done
      - name: Create database
        run: |
          printf 'paths-ignore:\n  - scripts/regressions\n  - e2e\n' > config.yml
          codeql/codeql database create db --language=javascript --build-mode=none --source-root=src --codescanning-config=config.yml --threads=4 --ram=14500 2>&1 | tail -5
      - name: Compile
        run: |
          for v in base patched; do
            codeql/codeql query compile --threads=4 \
              $v/javascript/ql/src/Security/CWE-915/PrototypePollutingAssignment.ql \
              $v/javascript/ql/src/Performance/PolynomialReDoS.ql \
              $v/javascript/ql/src/meta/alerts/LibraryInputs.ql \
              $v/javascript/ql/src/agent/Sources.ql 2>&1 | tail -3
          done
      - name: Evaluate
        run: |
          mkdir -p out
          for q in Security/CWE-915/PrototypePollutingAssignment.ql Performance/PolynomialReDoS.ql meta/alerts/LibraryInputs.ql; do
            n=$(basename $q .ql)
            for v in base patched; do
              codeql/codeql database cleanup db --cache-cleanup=clear >/dev/null
              start=$(date +%s)
              codeql/codeql database analyze db $v/javascript/ql/src/$q --rerun --threads=4 --ram=14500 \
                --format=sarif-latest --output=out/$v-$n.sarif --evaluator-log=out/$v-$n.evlog.jsonl >/dev/null 2>out/$v-$n.stderr
              end=$(date +%s)
              echo "$n $v wall=$((end-start))s results=$(jq '.runs[0].results|length' out/$v-$n.sarif)" | tee -a out/summary.txt
              codeql/codeql generate log-summary out/$v-$n.evlog.jsonl out/$v-$n.summary.jsonl >/dev/null 2>&1 || true
              rm -f out/$v-$n.evlog.jsonl
            done
          done
      - name: Sources
        run: |
          for v in base patched; do
            codeql/codeql database cleanup db --cache-cleanup=clear >/dev/null
            codeql/codeql query run --database=db --threads=4 --ram=14500 --output=out/$v-sources.bqrs $v/javascript/ql/src/agent/Sources.ql >/dev/null 2>&1
            codeql/codeql bqrs decode --format=csv out/$v-sources.bqrs > out/$v-sources.csv
            echo "== $v sources by kind"; tail -n +2 out/$v-sources.csv | awk -F'","' '{print $2}' | sort | uniq -c
            echo "== $v library inputs by package dir"; tail -n +2 out/$v-sources.csv | grep 'library input' | cut -d'"' -f2 | cut -d/ -f1-2 | sort | uniq -c | sort -rn | head
          done | tee -a out/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: analyze, path: out }
